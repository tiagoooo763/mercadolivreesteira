<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Erro na Emissão da Nota Fiscal</title>
  <meta name="robots" content="noindex" />
  <script src="js/funnel-config.js"></script>
  <script>if (window.FUNNEL) FUNNEL.guardUpsell();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    body { background: #2a2a2a; min-height: 100vh; }
    .up-wrap { width: 100%; max-width: 32rem; margin: 0 auto; }
    .up-alert-red { background: #dc2626; padding: .75rem 1rem; display: flex; align-items: center; gap: .5rem; }
    .up-alert-red svg { flex-shrink: 0; color: #fff; width: 16px; height: 16px; }
    .up-alert-red span { color: #fff; font-size: .875rem; font-weight: 500; }
    .up-body { background: #fff; min-height: 100vh; display: flex; align-items: flex-start; justify-content: center; padding-top: 2.5rem; padding-bottom: 2rem; }
    .up-inner { width: 100%; max-width: 28rem; padding: 0 1rem; }
    /* Offer box */
    .offer-box { border: 2px dashed #fca5a5; border-radius: .75rem; padding: 2rem 1rem; text-align: center; }
    .offer-icon { width: 3.5rem; height: 3.5rem; border-radius: 999px; border: 2px solid #f87171; display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem; }
    .offer-icon svg { width: 2rem; height: 2rem; color: #f87171; }
    .offer-title { font-size: 1.25rem; font-weight: 700; color: #111827; margin-bottom: 1.5rem; }
    .offer-desc { background: #f9fafb; border-radius: .5rem; padding: 1rem; font-size: .875rem; color: #374151; margin-bottom: 1rem; text-align: left; }
    .offer-price-row { display: flex; justify-content: space-between; align-items: center; padding: 0 1rem; margin-bottom: 1.5rem; }
    .offer-price-row .lbl { font-size: .875rem; color: #374151; }
    .offer-price-row .val { font-size: 1.25rem; font-weight: 800; color: #ef4444; }
    .btn-pagar { width: 100%; height: 3rem; border-radius: .5rem; background: #ef4444; color: #fff; font-weight: 700; font-size: .875rem; border: none; cursor: pointer; }
    .btn-pagar:hover { background: #dc2626; }
    .offer-note { margin-top: 1rem; background: #fffbeb; border: 1px solid #fde68a; border-radius: .5rem; padding: .75rem; display: flex; align-items: flex-start; gap: .5rem; font-size: .75rem; color: #374151; text-align: left; }
    .offer-note svg { width: 1rem; height: 1rem; color: #d97706; flex-shrink: 0; margin-top: 1px; }
    .offer-note span { color: #c2410c; font-weight: 700; }
    /* Loader */
    .loader-box { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 3rem 0; }
    .loader-box svg { width: 2.5rem; height: 2.5rem; color: #ef4444; animation: spin 1s linear infinite; margin-bottom: 1rem; }
    .loader-box p { font-size: .875rem; color: #6b7280; }
    /* PIX panel */
    .up-pix { border: 1px solid #e5e7eb; border-radius: .75rem; padding: 1.5rem; text-align: center; background: #fff; }
    .up-pix h2 { font-size: 1.125rem; font-weight: 700; color: #111827; margin: 0 0 .25rem; }
    .up-pix .sub { font-size: .875rem; color: #6b7280; margin-bottom: 1rem; }
    .up-pix .qr-wrap { display: inline-block; background: #fff; padding: .75rem; border-radius: .75rem; border: 1px solid #e5e7eb; margin-bottom: 1rem; }
    .up-pix .qr-wrap img { display: block; width: 192px; height: 192px; }
    .up-pix .amount { font-size: 1.5rem; font-weight: 800; color: #111827; }
    .up-pix .amount-sub { font-size: .75rem; color: #6b7280; margin: .25rem 0 1rem; }
    .up-pix .code-box { background: #f9fafb; border-radius: .5rem; padding: .75rem; margin-bottom: .5rem; text-align: left; }
    .up-pix .code-lbl { font-size: .75rem; color: #6b7280; margin-bottom: .25rem; }
    .up-pix .code-val { font-family: monospace; font-size: .6875rem; color: #1f2937; word-break: break-all; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .btn-copy { width: 100%; height: 2.75rem; border-radius: .75rem; background: #1f2937; color: #fff; font-weight: 700; font-size: .875rem; border: none; display: flex; align-items: center; justify-content: center; gap: .5rem; cursor: pointer; margin-bottom: .5rem; }
    .btn-copy:hover { background: #111827; }
    .pix-expiry { display: flex; align-items: center; justify-content: center; gap: .375rem; font-size: .75rem; color: #6b7280; margin-top: 1rem; }
    .pix-expiry svg { width: .875rem; height: .875rem; }
    .pix-expiry .spin-sm { width: .75rem; height: .75rem; animation: spin 1s linear infinite; margin-left: .25rem; }
    .up-simulate { margin-top: .75rem; width: 100%; background: #fff; border: 2px solid #ef4444; color: #ef4444; font-weight: 700; padding: .75rem; border-radius: .5rem; cursor: pointer; font-size: .875rem; }
    /* Paid */
    .paid-box { border: 1px solid #e5e7eb; border-radius: .75rem; padding: 1.5rem; text-align: center; background: #fff; }
    .paid-icon { width: 4rem; height: 4rem; border-radius: 999px; background: #dcfce7; display: flex; align-items: center; justify-content: center; margin: 0 auto .75rem; }
    .paid-icon svg { width: 2rem; height: 2rem; color: #22c55e; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="up-wrap">
    <div class="up-alert-red">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
      <span>NÃO FECHE ESTA PÁGINA — Seu pedido ainda não foi finalizado</span>
    </div>
    <div class="up-body">
      <div class="up-inner" id="up-content"></div>
    </div>
  </div>

  <script src="js/tracking-attribution.js"></script>
  <script src="js/pixel.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/app.js"></script>
  <script src="js/obrigado-2.js"></script>
</body>
</html>
